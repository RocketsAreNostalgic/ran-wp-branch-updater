name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@788f783d2998994f7aab9691710911ed1bd762c9
    with:
      php-floor: '8.2'
      php-current: '8.5'
      php-extensions: zip
      node-version: '24.11.0'

  consumer-install:
    name: Installed Composer consumer
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node for release classification
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.1.0
        with:
          node-version: '24.11.0'
          check-latest: false

      - name: Require release-driving squash title for production dependency changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          RAN_RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RAN_RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RAN_RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release-classification.mjs

      - name: Set up PHP floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prove an installed Composer consumer
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/branch-updater-consumer"
          php scripts/prepare-consumer-fixture.php "$consumer" "$GITHUB_WORKSPACE"
          composer --working-dir="$consumer" update --no-dev --no-interaction --prefer-dist --no-progress
          BRANCH_UPDATER_CONSUMER_ROOT="$consumer" php tests/consumer-install.php

  quality:
    if: ${{ always() }}
    needs:
      - baseline
      - consumer-install
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require all quality lanes
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          CONSUMER_RESULT: ${{ needs.consumer-install.result }}
        run: |
          printf 'baseline=%s\nconsumer=%s\n' "$BASELINE_RESULT" "$CONSUMER_RESULT"
          test "$BASELINE_RESULT" = success
          test "$CONSUMER_RESULT" = success
