name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@87e0b380092e0780861a5d9f6690a07f9d3dd0ac
    with:
      php-floor: '8.2'
      php-current: '8.5'
      php-extensions: zip
      node-version: '24.11.0'

  consumer-install:
    name: Installed Composer consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact Release Please PR for dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: dispatch-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_DISPATCH_HEAD_SHA: ${{ github.sha }}
          RAN_DISPATCH_HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_head='release-please--branches--main--components--ran/wp-branch-updater'
          test "$RAN_DISPATCH_HEAD_REF" = "$expected_head"
          pulls="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100")"
          candidate="$(jq -cer \
            --arg bot 'github-actions[bot]' \
            --arg head "$expected_head" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$RAN_DISPATCH_HEAD_SHA" \
            'add
            | [.[] | select(
                .state == "open"
                and .user.login == $bot
                and .base.ref == "main"
                and .base.repo.full_name == $repository
                and .head.ref == $head
                and .head.repo.full_name == $repository
                and .head.sha == $sha
              )]
            | if length == 1 then .[0] else error("Expected exactly one canonical Release Please pull request for dispatch.") end' \
            <<< "$pulls")"
          {
            printf 'base_sha=%s\n' "$(jq -er '.base.sha | select(test("^[0-9a-f]{40}$"))' <<< "$candidate")"
            printf 'head_sha=%s\n' "$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' <<< "$candidate")"
            printf 'title=%s\n' "$(jq -er '.title | select(type == "string" and length > 0 and (contains("\n") | not))' <<< "$candidate")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node for release classification
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          check-latest: false

      - name: Require release-driving squash title for production dependency changes
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          RAN_RELEASE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.dispatch-pr.outputs.base_sha }}
          RAN_RELEASE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || steps.dispatch-pr.outputs.head_sha }}
          RAN_RELEASE_PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || steps.dispatch-pr.outputs.title }}
        run: node scripts/release-classification.mjs

      - name: Set up PHP floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prove an installed Composer consumer
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/branch-updater-consumer"
          php scripts/prepare-consumer-fixture.php "$consumer" "$GITHUB_WORKSPACE"
          composer --working-dir="$consumer" update --no-dev --no-interaction --prefer-dist --no-progress
          BRANCH_UPDATER_CONSUMER_ROOT="$consumer" php tests/consumer-install.php

  installed-wordpress:
    name: Branch adapters / WordPress ${{ matrix.wordpress }} / PHP 8.2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['7.0', '7.0.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: branch_proof
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up PHP and WordPress CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli, zip
          tools: composer:v2, wp-cli:2.12.0
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install disposable WordPress and prove Branch adapters
        env:
          RAN_BRANCH_WORDPRESS_PATH: ${{ runner.temp }}/branch-wordpress
          RAN_BRANCH_DISPOSABLE: '1'
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          wp core download --path="$RAN_BRANCH_WORDPRESS_PATH" --version="$WORDPRESS_VERSION"
          test "$(wp core version --path="$RAN_BRANCH_WORDPRESS_PATH")" = "$WORDPRESS_VERSION"
          wp config create --path="$RAN_BRANCH_WORDPRESS_PATH" --dbname=branch_proof --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp config set FS_METHOD direct --path="$RAN_BRANCH_WORDPRESS_PATH"
          wp config set DISABLE_WP_CRON true --raw --path="$RAN_BRANCH_WORDPRESS_PATH"
          wp core install --path="$RAN_BRANCH_WORDPRESS_PATH" --url=http://localhost --title='Branch proof' --admin_user=admin --admin_password=local-proof-only --admin_email=proof@example.com --skip-email
          printf '%s\n' 'RAN Branch disposable site' > "$RAN_BRANCH_WORDPRESS_PATH/.ran-branch-disposable"
          php tests/installed-wordpress.php

  quality:
    if: ${{ always() }}
    needs:
      - baseline
      - consumer-install
      - installed-wordpress
    runs-on: ubuntu-24.04
    steps:
      - name: Require all quality lanes
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          WORDPRESS_RESULT: ${{ needs.installed-wordpress.result }}
          CONSUMER_RESULT: ${{ needs.consumer-install.result }}
        run: |
          printf 'baseline=%s\nconsumer=%s\n' "$BASELINE_RESULT" "$CONSUMER_RESULT"
          test "$BASELINE_RESULT" = success
          test "$CONSUMER_RESULT" = success
          test "$WORDPRESS_RESULT" = success
