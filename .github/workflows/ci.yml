name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@d62beee5d27bd086317cea2446081144fedb5938
    with:
      php-floor: '8.2'
      php-current: '8.5'
      php-extensions: zip
      node-version: '24.11.0'
      runner: blacksmith-2vcpu-ubuntu-2404

  consumer-install:
    name: Installed Composer consumer
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prove an installed Composer consumer
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/branch-updater-consumer"
          php scripts/prepare-consumer-fixture.php "$consumer" "$GITHUB_WORKSPACE"
          composer --working-dir="$consumer" update --no-dev --no-interaction --prefer-dist --no-progress
          BRANCH_UPDATER_CONSUMER_ROOT="$consumer" php tests/consumer-install.php

  quality:
    if: ${{ always() }}
    needs:
      - baseline
      - consumer-install
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require all quality lanes
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          CONSUMER_RESULT: ${{ needs.consumer-install.result }}
        run: |
          printf 'baseline=%s\nconsumer=%s\n' "$BASELINE_RESULT" "$CONSUMER_RESULT"
          test "$BASELINE_RESULT" = success
          test "$CONSUMER_RESULT" = success
