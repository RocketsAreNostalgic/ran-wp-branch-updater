name: Updater support lock evidence

on:
  push:
    branches: [deps/pin-updater-support-beta2]
    paths:
      - .github/workflows/refresh-updater-support-evidence.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Set up PHP floor and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Resolve the published updater-support prerelease
        run: composer update ran/updater-support --with-dependencies --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Verify exact resolved version and source
        run: |
          php -r '$lock=json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR); $p=array_values(array_filter($lock["packages"], fn($p)=>$p["name"]==="ran/updater-support")); if(count($p)!==1 || $p[0]["version"]!=="v0.1.0-beta.2" || $p[0]["source"]["reference"]!=="83384bb6f4652d8988374867f4103fde63878451") { fwrite(STDERR, "Unexpected updater-support resolution\n"); exit(1); }'
          composer validate --strict --no-check-publish

      - name: Commit exact generated lockfile
        run: |
          set -euo pipefail
          git add -- composer.lock
          test "$(git diff --cached --name-only)" = "composer.lock"
          if git diff --cached --quiet; then
            echo "composer.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock updater-support beta.2"
          git push origin HEAD:deps/pin-updater-support-beta2
