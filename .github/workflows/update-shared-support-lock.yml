name: Update shared support lock

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-lock:
    if: ${{ github.head_ref == 'refactor/shared-repository-relative-path' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up PHP floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Resolve updater-support beta.3
        run: composer update ran/updater-support --with-dependencies --no-interaction --prefer-dist --no-progress

      - name: Commit generated lock when changed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.lock; then
            echo 'composer.lock already matches composer.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'build: refresh updater support lock'
          git push origin "HEAD:${HEAD_BRANCH}"
